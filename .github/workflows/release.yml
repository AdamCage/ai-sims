name: Build Windows release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version
        required: true
        default: 0.3.0-beta.1

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        shell: pwsh
        run: |
          ./tools/install_godot_ci.ps1 -TemplateFiles @('windows_release_x86_64.exe','windows_release_x86_64_console.exe','version.txt')
      - name: Build and verify standalone candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/build_release.ps1 -Version $env:RELEASE_VERSION
      - name: Preserve logs and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-checks
          path: |
            build/release-logs/*.log
            build/release-smoke.*.log
            build/release-verification.json
          if-no-files-found: ignore
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AI-Sims-Windows-x64
          path: |
            build/AI-Sims-Windows-x64.zip
            build/AI-Sims-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
